name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Test
        run: poetry run python -m pytest -q
