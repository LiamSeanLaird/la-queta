# Per-repo no-mistakes overrides.

# Run the full suite with the project's `la-queta` conda env (the Makefile
# assumes it too). Plain `poetry run` picks the base miniforge Python, because
# poetry.toml sets virtualenvs.create=false, and that Python has no pytest.
# .github/workflows/ci.yml installs its own env and runs pytest on every PR.
commands:
  test: '"$HOME/miniforge3/envs/la-queta/bin/python" -m pytest -q'
