# nginx site for la-queta.com (/etc/nginx/sites-available/la-queta).
#
# One canonical origin: https://la-queta.com (matches PUBLIC_BASE_URL).
# - http://la-queta.com and http://www.la-queta.com -> 301 to https://la-queta.com
# - https://www.la-queta.com                         -> 301 to https://la-queta.com
# - https://la-queta.com                             -> proxied to gunicorn
# The path and query string are kept on every redirect ($request_uri).
# Flask also redirects www to apex (app/www_redirect.py) as a fallback.
#
# Certificate paths are the ones certbot (--nginx) creates. The certificate
# must cover both la-queta.com and www.la-queta.com, or browsers reject the
# www redirect before it happens:
#   sudo certbot --nginx -d la-queta.com -d www.la-queta.com
#
# Plain-HTTP access by IP (or any other Host) still reaches the app through the
# default_server block, so `curl http://127.0.0.1/api/health` keeps working.

# HTTP: send the domain to HTTPS; serve anything else (IP, localhost) directly.
server {
    listen 80;
    listen [::]:80;
    server_name la-queta.com www.la-queta.com;

    # certbot HTTP-01 renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://la-queta.com$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS www: redirect to the apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.la-queta.com;

    ssl_certificate /etc/letsencrypt/live/la-queta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/la-queta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://la-queta.com$request_uri;
}

# HTTPS apex: the real site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name la-queta.com;

    ssl_certificate /etc/letsencrypt/live/la-queta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/la-queta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
